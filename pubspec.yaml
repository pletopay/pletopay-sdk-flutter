name: pletopay_flutter
description: Pletopay checkout for Flutter. Shows the hosted bank-transfer checkout in a WebView with completion detection, plus a headless client for the checkout session API.
version: 1.0.0
homepage: https://docs.pletopay.com/checkout/hosted
repository: https://github.com/pletopay/pletopay-sdk-flutter
issue_tracker: https://github.com/pletopay/pletopay-sdk-flutter/issues
topics:
  - payments
  - checkout
  - nigeria
  - webview

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  clock: ^1.1.0
  flutter:
    sdk: flutter
  http: ^1.2.0
  webview_flutter: ^4.10.0

dev_dependencies:
  fake_async: ^1.3.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  webview_flutter_platform_interface: ^2.10.0

flutter:
